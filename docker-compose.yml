# docker-compose.yml — shared local GLPI 11 + MariaDB development stack
#
# All Git worktrees use one Compose project, including its containers and volumes.
# Running `docker compose up` from another worktree switches the mounted plugin
# source without creating another GLPI test instance.
#
# The plugin uses GLPI core's SMTP configuration. Set GLPI_SMTP_HOST and the
# optional SMTP variables documented in README.md; keep credentials in .env.
#
# Usage:
#   docker compose up -d --build
#   open http://localhost:8080   (default GLPI login:
#     glpi / glpi — change on first login)

name: ticketmailer
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: glpi
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  glpi:
    build:
      context: ./docker/glpi
    image: ticketmailer/glpi:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: glpi
      GLPI_SMTP_HOST: ${GLPI_SMTP_HOST:-}
      GLPI_SMTP_PORT: ${GLPI_SMTP_PORT:-587}
      GLPI_SMTP_MODE: ${GLPI_SMTP_MODE:-3}
      GLPI_SMTP_USERNAME: ${GLPI_SMTP_USERNAME:-}
      GLPI_SMTP_PASSWORD: ${GLPI_SMTP_PASSWORD:-}
      GLPI_INSTALL: "1"
    volumes:
      # Mount the plugin source from the repo root.
      - .:/var/www/html/plugins/ticketmailer
      # Persist GLPI config and data.
      - glpi_config:/var/www/html/config
      - glpi_data:/var/www/html/files

volumes:
  db_data:
  glpi_data:
  glpi_config:

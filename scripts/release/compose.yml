name: ticketmailer-release-check
services:
  db:
    image: mariadb:10.11.19@sha256:7d829180b5b2a9ba74f6242876ab401a0d7dd338a807e522ef92bc9698760f20
    environment:
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: glpi
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 40
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports: ['127.0.0.1:${RELEASE_MAIL_PORT:-18025}:8025']
  glpi:
    build:
      context: ../../docker/glpi
      args:
        GLPI_VERSION: ${RELEASE_GLPI_VERSION:-12.0.2}
        GLPI_SHA256: ${RELEASE_GLPI_SHA256:-028d9d275cf747600bbbefe072fd0724c1d4e7eee18378e696fea60a73d50359}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: glpi
      GLPI_INSTALL: '1'
      TICKETMAILER_E2E: '1'
      GLPI_SMTP_HOST: mailpit
      GLPI_SMTP_PORT: '1025'
      GLPI_SMTP_MODE: '1'
      GLPI_SMTP_CHECK_CERTIFICATE: '0'
    ports: ['127.0.0.1:${RELEASE_HTTP_PORT:-18080}:80']
    volumes:
      - ${RELEASE_PLUGIN_DIR:?set package directory}:/var/www/html/plugins/ticketmailer:ro
      - ${RELEASE_FIXTURE_DIR:?set fixture directory}/e2e-fixture.php:/usr/local/bin/e2e-fixture.php:ro
      - ${RELEASE_FIXTURE_DIR:?set fixture directory}/migration.php:/usr/local/bin/release-migration.php:ro
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost/index.php >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 60
